<input type="file" id="trp3File" accept=".lua">
<input type="text" id="charName" placeholder="Terawyne-MoonGuard">
<button id="parseBtn">Parse</button>

<pre id="output"></pre>

<script type="module">
  import luaparse from "https://cdn.jsdelivr.net/npm/luaparse@0.3.1/+esm";

  async function loadJSON(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("Failed to load " + url);
    return await resp.json();
  }

function luaAstToJs(node) {
  if (!node) return null;

  switch (node.type) {
    case "StringLiteral": return node.value;
    case "NumericLiteral": return node.value;
    case "BooleanLiteral": return node.value;
    case "NilLiteral": return null;

    case "TableConstructorExpression": {
      const obj = {};
      let arrayIndex = 1;

      for (const field of node.fields) {

        // foo = {...}
        if (field.type === "TableKeyString") {
          obj[field.key.name] = luaAstToJs(field.value);
          continue;
        }

        // ["foo"] = {...}   OR   [123] = {...}
        if (field.type === "TableKey") {
          let key = null;

          if (field.key.type === "StringLiteral") key = field.key.value;
          else if (field.key.type === "NumericLiteral") key = String(field.key.value);
          else key = String(luaAstToJs(field.key));

          obj[key] = luaAstToJs(field.value);
          continue;
        }

        // { "a", "b", "c" }
        if (field.type === "TableValue") {
          obj[String(arrayIndex)] = luaAstToJs(field.value);
          arrayIndex++;
          continue;
        }
      }

      return obj;
    }

    default:
      console.warn("Unhandled AST node type:", node.type);
      return null;
  }
}
  }

  function extractGlobalsFromLua(luaText) {
    const ast = luaparse.parse(luaText);

    const globals = {};
    for (const stmt of ast.body) {
      if (stmt.type !== "AssignmentStatement") continue;

      for (let i = 0; i < stmt.variables.length; i++) {
        const variable = stmt.variables[i];
        const initValue = stmt.init[i];

        if (!variable || variable.type !== "Identifier") continue;

        const name = variable.name;
        if (name === "TRP3_Characters" || name === "TRP3_Profiles" || name === "TRP3_Companions") {
          globals[name] = luaAstToJs(initValue);
        }
      }
    }
    return globals;
  }

  const relationship_status = ["NA", "Single", "Taken", "Married", "Divorced", "Widowed"];

  function parseIcon(name, baseUrl, lookup) {
    const iconName = lookup[name];
    return iconName ? `${baseUrl}/ICONS/${iconName}` : null;
  }

  function formatCharacteristics(characteristics, iconLookup, imageBaseUrl) {
    const jdict = { basic: {}, additional: {}, top: {}, sliders: [] };

    for (const [key, value] of Object.entries(characteristics)) {
      switch (key) {
        case "FN": jdict.top["First Name"] = value; break;
        case "FT": jdict.top["Full Title"] = value; break;
        case "LN": jdict.top["Last Name"] = value; break;
        case "IC": jdict.top["Class Icon"] = parseIcon(value, imageBaseUrl, iconLookup); break;

        case "RA": jdict.basic["Race"] = value; break;
        case "CL": jdict.basic["Class Name"] = { value, color: characteristics["CH"] }; break;
        case "CH": break;

        case "AG": jdict.basic["Age"] = value; break;
        case "EC": jdict.basic["Eye Color"] = { value, color: characteristics["EH"] }; break;
        case "EH": break;

        case "HE": jdict.basic["Height"] = value; break;
        case "WE": jdict.basic["Body Shape"] = value; break;
        case "BP": jdict.basic["Birthplace"] = value; break;
        case "RE": jdict.basic["Residence"] = value; break;

        case "RS":
          jdict.basic["Relationship Status"] = relationship_status[value] ?? value;
          break;

        case "MI":
          Object.values(value).forEach(custom => {
            jdict.additional[custom.NA] = {
              value: custom.VA,
              icon: parseIcon(custom.IC, imageBaseUrl, iconLookup)
            };
          });
          break;

        case "PS":
          Object.values(value).forEach(slider => {
            jdict.sliders.push([
              { value: slider.LT, icon: slider.LI, color: slider.LC },
              slider.V2,
              { value: slider.RT, icon: slider.RI, color: slider.RC }
            ]);
          });
          break;

        default:
          break;
      }
    }

    return jdict;
  }

  async function parseTRP3(luaText, characterName) {
    const iconLookup = await loadJSON("./icon_map.json");
    const imageBaseUrl = "https://raw.githubusercontent.com/keyboardturner/wow-ui-art/retail_png";

    const globals = extractGlobalsFromLua(luaText);

    const characters = globals.TRP3_Characters;
    const profiles = globals.TRP3_Profiles;

    if (!characters) throw new Error("TRP3_Characters not found.");
    if (!profiles) throw new Error("TRP3_Profiles not found.");

    const charData = characters[characterName];
    if (!charData) throw new Error("Character not found: " + characterName);

    const character_id = charData.profileID;

    const profile = profiles[character_id]?.player;
    if (!profile) throw new Error("Profile not found: " + character_id);

    const formatted = formatCharacteristics(profile.characteristics, iconLookup, imageBaseUrl);

    return {
      character_name: characterName,
      character_id,
      about: profile.about,
      glance: profile.misc?.PE,
      formatted_characteristics: formatted
    };
  }

  document.getElementById("parseBtn").addEventListener("click", async () => {
    const fileInput = document.getElementById("trp3File");
    const characterName = document.getElementById("charName").value.trim();
    const outputBox = document.getElementById("output");

    if (!fileInput.files.length) {
      outputBox.textContent = "Upload totalRP3.lua first.";
      return;
    }
    if (!characterName) {
      outputBox.textContent = "Enter character name (Name-Realm).";
      return;
    }

    const file = fileInput.files[0];
    const luaText = await file.text();

    try {
      const parsed = await parseTRP3(luaText, characterName);
      outputBox.textContent = JSON.stringify(parsed, null, 2);
    } catch (err) {
      outputBox.textContent = "ERROR: " + err.message;
    }
  });
</script>
