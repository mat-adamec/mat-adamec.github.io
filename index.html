<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TRP3 Lua → HTML Formatter</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 800px; }
    h1 { font-size: 1.8rem; }
    input, button, textarea { margin: 0.5rem 0; }
    textarea { width: 100%; height: 250px; }
    #outputPreview { border: 1px solid #ccc; padding: 1rem; background: #f9f9f9; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>TRP3 Lua → HTML Formatter</h1>

  <p>Select a TRP3 `.lua` file to convert to HTML:</p>
  <input type="file" id="luaFile" accept=".lua"><br>
  <button onclick="convertLua()" id="convertBtn" disabled>Convert to HTML</button>
  <button onclick="downloadHTML()" id="downloadBtn" disabled>Download HTML</button>

  <h2>HTML Output Preview</h2>
  <div id="outputPreview"></div>

  <textarea id="outputText" readonly placeholder="Converted HTML will appear here..." style="display:none;"></textarea>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
  <script>
    let pyodide = null;
    let htmlResult = "";

    // Load Pyodide on page load
    async function initPyodide() {
      pyodide = await loadPyodide();
      console.log("Pyodide loaded.");

      // Enable convert button after Pyodide is ready
      document.getElementById("convertBtn").disabled = false;
    }

    initPyodide();

    async function convertLua() {
      const fileInput = document.getElementById("luaFile");
      const file = fileInput.files[0];
      if (!file) return alert("Please select a LUA file.");

      const luaText = await file.text();

      // Load trp3_dump.py
      const pyCode = await fetch("trp3_dump.py").then(r => r.text());
      pyodide.runPython(pyCode);

      // Write the uploaded file to Pyodide's virtual filesystem
      pyodide.FS.writeFile("input.lua", luaText);

      // Run your lua_to_html function from Python
      htmlResult = pyodide.runPython(`
with open("input.lua") as f:
    lua_text = f.read()
result = get_characteristics(lua_text)
result
`);

      // Show the result
      document.getElementById("outputPreview").innerHTML = htmlResult;
      const outputTextArea = document.getElementById("outputText");
      outputTextArea.value = htmlResult;
      outputTextArea.style.display = "block";

      // Enable download
      document.getElementById("downloadBtn").disabled = false;
    }

    function downloadHTML() {
      if (!htmlResult) return;
      const blob = new Blob([htmlResult], { type: "text/html" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "formatted.html";
      a.click();

      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
